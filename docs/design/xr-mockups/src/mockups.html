<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>XR mockups</title>
<!-- Rebuilds docs/design/xr-mockups/*.png: background renders (Blender) + UI per docs/design/XR_NATIVE_SPEC.md.
     Usage: Chrome --headless --window-size=1600,1000 --screenshot=out.png "mockups.html?s=a" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Inter:wght@400..700&display=block">
<script src="anchors.js"></script>
<style>
:root{
  --accent:#9ecfff; --accent-deep:#274a6b; --success:#6fdc9b; --error:#ff8a7a; --unsure:#e8c14b; --warn:#ffa95c;
  --font:"Google Sans","Inter",Arial,sans-serif;
  /* 1° ≈ 21.7 px in these renders (24 mm lens, 1600 px) */
  --deg:21.7px;
}
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:1000px;overflow:hidden;background:#000;font-family:var(--font);-webkit-font-smoothing:antialiased;color:#fff}
#bg{position:absolute;inset:0;background-size:cover;filter:saturate(.86) contrast(.96) brightness(.93) blur(.35px)}
/* passthrough grain on the camera image only */
#grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:absolute;inset:0;perspective:2200px}
svg.ov{position:absolute;inset:0;width:1600px;height:1000px;overflow:visible}

/* ---------- glass recipe (spec §3.1) ---------- */
.glass{position:absolute;isolation:isolate;
  background:
    linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,0) 45%),
    linear-gradient(180deg,rgba(24,27,31,.90),rgba(8,9,11,.92));
  box-shadow:inset 0 -14px 26px -14px rgba(0,0,0,.35), 0 0 46px 6px rgba(0,0,0,.16);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.12) 40%,rgba(255,255,255,.07));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---------- window ---------- */
.win{border-radius:32px;padding:30px 30px 0 30px;transform-style:preserve-3d}
.win .bar{position:absolute;left:32px;right:32px;top:13px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.win .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.cols{display:flex;gap:28px;height:100%}
.txt{flex:1.5;display:flex;flex-direction:column;min-width:0}
.well{flex:1;margin:8px 0 74px;border-radius:20px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;position:relative}
.well .pg{position:absolute;left:14px;bottom:10px;font-size:20px;color:rgba(255,255,255,.62);font-weight:500}
.lab{font-size:16.5px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.70);display:flex;align-items:center;gap:9px;margin-top:8px;white-space:nowrap}
.title{font-size:39px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin-top:14px;color:#fff}
.body{font-size:24px;font-weight:500;line-height:1.36;color:rgba(255,255,255,.88);margin-top:10px}
.chips{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.chip{height:36px;padding:0 15px;border-radius:18px;white-space:nowrap;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);display:flex;align-items:center;gap:7px;font-size:17px;font-weight:500;color:rgba(255,255,255,.9)}
.chip b{font-weight:600;color:#fff}
.chip.focus{background:var(--accent-deep);box-shadow:none;color:#fff}
.dot{width:16px;height:16px;border-radius:50%;background:var(--accent);flex:none}

/* status shapes */
.st{flex:none;display:inline-flex;align-items:center;justify-content:center;color:#0c0c0c;font-weight:700}

/* ---------- toolbar ornament ---------- */
.orn{border-radius:999px;display:flex;gap:12px;padding:9px;align-items:center}
.btn{height:58px;min-width:84px;padding:0 24px;white-space:nowrap;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:600;color:#fff;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.icon{min-width:84px;width:84px;padding:0}
.btn.primary{background:var(--accent-deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);min-width:170px}
.btn.hover{transform:scale(1.03);background:radial-gradient(60px 60px at 62% 40%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%),rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.btn svg{width:26px;height:26px}
.grab{position:absolute;height:7px;border-radius:4px;background:rgba(255,255,255,.35)}

/* ---------- parts ornament ---------- */
.parts{border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;align-items:center}
.parts .lab{margin:0;align-self:flex-start;font-size:19px}
.parts img{width:150px;height:150px;object-fit:contain;margin:4px 0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.parts .nm{font-size:24px;font-weight:600;text-align:center;line-height:1.2}
.parts .cd{font-size:19px;color:rgba(255,255,255,.66);font-weight:500;margin-top:4px}

/* ---------- label pill ---------- */
.pill{border-radius:999px;height:46px;padding:0 8px 0 20px;display:flex;align-items:center;gap:10px;white-space:nowrap;transform:translate(-50%,-100%)}
.pill .n{font-size:24px;font-weight:600}
.pill .c{font-size:18px;font-weight:500;color:rgba(255,255,255,.68)}
.pill .k{height:31px;padding:0 12px;border-radius:16px;background:var(--accent-deep);font-size:18px;font-weight:600;display:flex;align-items:center}
.pill.solo{padding-right:20px}
.badge{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center}
.cap{position:absolute;border-radius:999px;height:40px;padding:0 18px 0 12px;display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;white-space:nowrap}
.cap svg{width:26px;height:26px}
.caption{font-size:24px;color:rgba(255,255,255,.68);font-weight:500;margin-top:auto;margin-bottom:96px;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div id="bg"></div><div id="grain"></div>
<div id="stage"></div>
<script>
const S = new URLSearchParams(location.search).get('s') || 'a';
const A = (window.ANCH || {})[S] || {};
document.getElementById('bg').style.backgroundImage = `url(bg_${S}.png)`;
const stage = document.getElementById('stage');
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = t.content.firstChild; stage.appendChild(n); return n; };
const svgNS = 'http://www.w3.org/2000/svg';
const ov = document.createElementNS(svgNS, 'svg'); ov.setAttribute('class', 'ov'); stage.appendChild(ov);
function line(x1, y1, x2, y2, stroke = 'rgba(255,255,255,.72)', w = 2.4) {
  const l = document.createElementNS(svgNS, 'line');
  Object.entries({ x1, y1, x2, y2, stroke, 'stroke-width': w, 'stroke-linecap': 'round' }).forEach(([k, v]) => l.setAttribute(k, v));
  ov.appendChild(l);
  const c = document.createElementNS(svgNS, 'circle');
  Object.entries({ cx: x2, cy: y2, r: 5, fill: '#fff' }).forEach(([k, v]) => c.setAttribute(k, v));
  ov.appendChild(c);
}
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  driver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 9.5l6-6"/><path d="M12.5 7.5l4 4-6.5 6.5a2.8 2.8 0 0 1-4-4z"/><path d="M6 18l-2.5 2.5"/></svg>',
  turn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>',
};
function status(kind, size = 30) {
  const c = { info: 'var(--accent)', success: 'var(--success)', error: 'var(--error)', unsure: 'var(--unsure)' }[kind];
  const r = size / 2;
  let shape = `<circle cx="${r}" cy="${r}" r="${r}" fill="${c}"/>`;
  if (kind === 'error') {
    const p = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; p.push(`${r + r * Math.cos(a)},${r + r * Math.sin(a)}`); }
    shape = `<polygon points="${p.join(' ')}" fill="${c}"/>`;
  }
  if (kind === 'unsure') shape = `<polygon points="${r},0 ${size},${r} ${r},${size} 0,${r}" fill="${c}"/>`;
  const g = { success: `<path d="M${r * .52} ${r * 1.02}l${r * .33} ${r * .33} ${r * .66}-${r * .7}" stroke="#0c0c0c" stroke-width="${size * .11}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
              error: `<path d="M${r * .62} ${r * .62}L${r * 1.38} ${r * 1.38}M${r * 1.38} ${r * .62}L${r * .62} ${r * 1.38}" stroke="#0c0c0c" stroke-width="${size * .11}" stroke-linecap="round"/>`,
              unsure: `<text x="${r}" y="${r * 1.36}" text-anchor="middle" font-size="${size * .56}" font-weight="700" fill="#0c0c0c" font-family="Google Sans,Inter">?</text>`, info: '' }[kind];
  return `<svg class="st" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${shape}${g}</svg>`;
}
/* own line drawing for the guide well (the app shows the guide crop here) */
function drawing(kind) {
  const s = 'stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"';
  if (kind === 'side') return `<svg width="200" height="200" viewBox="0 0 200 200"><g ${s}><path d="M30 150 L120 175 L175 140 L85 118 Z"/><path d="M30 150 L30 158 L120 183 L175 148 L175 140"/><path d="M60 140 L60 40 L70 37 L70 137"/><path d="M60 40 L70 37"/><path d="M140 152 L140 52 L150 49 L150 149" stroke-dasharray="6 5"/><path d="M160 30 L160 10" /><path d="M153 22 L160 30 L167 22"/></g><circle cx="145" cy="147" r="4" fill="#fff"/></svg>`;
  if (kind === 'runner') return `<svg width="200" height="200" viewBox="0 0 200 200"><g ${s}><path d="M25 120 L120 160 L180 120 L85 85 Z"/><path d="M25 120 L25 135 L120 175 L180 135 L180 120"/><path d="M35 112 L95 88 L100 90 L40 114 Z"/><path d="M125 150 L180 125 L185 127 L130 152 Z"/></g><text x="52" y="78" fill="#fff" font-size="22" font-family="Google Sans,Inter" font-weight="600">DL</text><text x="150" y="104" fill="#fff" font-size="22" font-family="Google Sans,Inter" font-weight="600">DR</text></svg>`;
  return '';
}
function windowEl({ x, y, w, h, rotY = -9, label, labelKind = 'info', title, body, chips = [], well, page, progress, caption }) {
  const win = el(`<div class="glass win" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotateY(${rotY}deg) rotateX(6deg)">
    ${progress != null ? `<div class="bar"><i style="width:${progress * 100}%"></i></div>` : ''}
    <div class="cols"><div class="txt">
      <div class="lab">${status(labelKind, 24)}<span>${label}</span></div>
      <div class="title">${title}</div>
      ${body ? `<div class="body">${body}</div>` : ''}
      ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
      ${caption ? `<div class="caption">${caption}</div>` : ''}
    </div>
    ${well ? `<div class="well">${drawing(well)}<div class="pg">${page}</div></div>` : ''}
    </div></div>`);
  return win;
}
function toolbar({ x, y, w, rotY = -9, items, cx }) {
  const html = items.map((it) => `<div class="btn ${it.cls || ''}">${it.icon ? ICON[it.icon] : ''}${it.text ? `<span>${it.text}</span>` : ''}</div>`).join('');
  return el(`<div class="glass orn" style="left:${x}px;top:${y}px;transform:translateX(-50%) rotateY(${rotY}deg) rotateX(6deg) translateZ(18px)">${html}</div>`);
}
function pill(x, y, name, code, count, extra = '') {
  return el(`<div class="glass pill ${count ? '' : 'solo'}" style="left:${x}px;top:${y}px;${extra}"><span class="n">${name}</span>${code ? `<span class="c">${code}</span>` : ''}${count ? `<span class="k">${count}</span>` : ''}</div>`);
}

const P = (k) => A[k] || [800, 500, 1];

if (S === 'a') {
  const g = P('ghost_top');
  // label above the ghost
  const lx = g[0] - 10, ly = g[1] - 92;
  line(lx, ly, g[0], g[1] + 4);
  pill(lx, ly, 'Πλαϊνό, δεξί', '', '2 από 2');
  windowEl({ x: 860, y: 190, w: 700, h: 458, label: 'ΒΗΜΑ 2 ΑΠΟ 7 · ΣΕΛΙΔΑ 5', title: 'Βάλε το δεξί πλαϊνό', body: 'Πέρασέ το πάνω από τη βίδα,<br>με την καβίλια στην τρύπα.',
    chips: ['<div class="chip focus">Πλαϊνό 2 από 2</div>', '<div class="chip"><b>Καβίλια</b> 101345</div>'], well: 'side', page: 'σ. 5', progress: 2 / 7 });
  toolbar({ x: 1205, y: 614, items: [{ icon: 'back' }, { icon: 'repeat' }, { icon: 'mic' }, { text: 'Επόμενο', icon: 'next', cls: 'primary' }] });
  el(`<div class="grab" style="left:1165px;top:700px;width:80px;transform:rotateY(-9deg)"></div>`);
}

if (S === 'b') {
  const g = P('ghost_top');
  const lx = g[0] + 40, ly = g[1] - 70;
  line(lx - 60, ly, g[0], g[1] + 2);
  pill(lx - 60, ly, 'Πλαϊνό, δεξί', '', '2 από 2');
}

if (S === 'c') {
  const k = P('lock');
  const lx = k[0] - 170, ly = k[1] - 210;
  line(lx, ly, k[0] - 6, k[1] - 6);
  pill(lx, ly, 'Κλειδαριά έκκεντρου', '120076', '1 από 2');
  // amount + tool chip beside the turning arrow
  el(`<div class="glass cap" style="left:${k[0] + 70}px;top:${k[1] - 40}px">${ICON.driver}<span>½ στροφή ως να κλειδώσει</span></div>`);
}

if (S === 'd') {
  const w = P('wrong'), g = P('ghost');
  // ✕ badge over the wrong part
  el(`<div class="badge" style="left:${w[0] - 8}px;top:${w[1] - 70}px">${status('error', 48)}</div>`);
  line(w[0] - 8, w[1] - 46, w[0] - 4, w[1] + 2, 'rgba(255,138,122,.85)', 2.4);
  // where DR goes: one ghost, short azure label
  const gx = g[0] + 10, gy = g[1] - 80;
  line(gx, gy, g[0], g[1] + 4);
  pill(gx, gy, 'Ο DR πάει εδώ', '', '');
  windowEl({ x: 950, y: 450, w: 620, h: 350, rotY: -10, label: '<span style="color:var(--error)">ΛΑΘΟΣ</span> · ΒΗΜΑ 6 ΑΠΟ 7', labelKind: 'error', title: 'Αυτός είναι ο DR', body: 'Αριστερά μπαίνει ο οδηγός DL.<br>Σελίδα 7.',
    chips: ['<div class="chip"><b>DL</b> αριστερά</div>', '<div class="chip"><b>DR</b> δεξιά</div>'], progress: 6 / 7 });
  toolbar({ x: 1255, y: 770, rotY: -10, items: [{ icon: 'back' }, { icon: 'repeat' }, { icon: 'mic' }, { text: 'Επόμενο', icon: 'next', cls: 'primary' }] });
  // spoken caption pill under the badge region (speech is also shown in the window)
}

if (S === 'e') {
  const c = ['c0', 'c1', 'c2', 'c3'].map(P);
  // viewfinder brackets on the box (azure while identifying)
  const L = 46;
  const corner = (p, dx, dy) => {
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', `M${p[0] + dx * L} ${p[1]} L${p[0]} ${p[1]} L${p[0]} ${p[1] + dy * L}`);
    Object.entries({ stroke: '#9ecfff', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => path.setAttribute(k, v));
    ov.appendChild(path);
  };
  corner([c[0][0] - 14, c[0][1] + 14], 1, -1); corner([c[1][0] + 14, c[1][1] + 14], -1, -1);
  corner([c[2][0] + 14, c[2][1] - 14], -1, 1); corner([c[3][0] - 14, c[3][1] - 14], 1, 1);
  // light sweep across the label area
  const sw = document.createElementNS(svgNS, 'g');
  sw.innerHTML = `<defs><linearGradient id="sw" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9ecfff" stop-opacity="0"/><stop offset=".5" stop-color="#9ecfff" stop-opacity=".28"/><stop offset="1" stop-color="#9ecfff" stop-opacity="0"/></linearGradient>
    <clipPath id="bx"><polygon points="${c.map((p) => p.slice(0, 2).join(',')).join(' ')}"/></clipPath></defs>
    <g clip-path="url(#bx)"><rect x="${(c[0][0] + c[1][0]) / 2 - 40}" y="0" width="150" height="1000" fill="url(#sw)" transform="skewX(-14)"/></g>`;
  ov.appendChild(sw);
  windowEl({ x: 1080, y: 130, w: 480, h: 268, rotY: -8, label: '2 ΑΠΟ 5 · ΑΝΑΓΝΩΡΙΣΗ', title: 'Αναγνωρίζω…', body: 'Διαβάζω την ετικέτα.' });
  toolbar({ x: 1320, y: 370, rotY: -8, items: [{ text: 'Άκυρο' }] });
}

if (S === 'f') {
  const t = P('top');
  el(`<div class="badge" style="left:${t[0]}px;top:${t[1] - 120}px">${status('success', 56)}</div>`);
  windowEl({ x: 960, y: 200, w: 620, h: 406, rotY: -9, label: 'ΒΗΜΑ 7 ΑΠΟ 7 · ΕΓΙΝΕ', labelKind: 'success', title: '<span style="font-size:58px;letter-spacing:-.02em;line-height:1.08">Το συρτάρι<br>είναι έτοιμο</span>', body: '7 βήματα · 26 κινήσεις · 18 λεπτά', progress: 1 });
  toolbar({ x: 1270, y: 580, rotY: -9, items: [{ text: 'Από την αρχή' }, { text: 'Τέλος', icon: 'check', cls: 'primary' }] });
}
</script>
</body>
</html>
